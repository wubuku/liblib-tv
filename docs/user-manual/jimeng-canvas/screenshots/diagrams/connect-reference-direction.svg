<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="t d" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <title id="t">参考连线方向示意</title>
  <desc id="d">左侧带媒体的参考节点经一条参考连线指向右侧的空生成节点，箭头方向表示参考到生成；右侧节点下方是生成面板。</desc>

  <rect width="880" height="400" fill="#141414"/>

  <!-- source node -->
  <rect x="40" y="70" width="250" height="150" rx="10" fill="#232323" stroke="#3d3d3d" stroke-width="1"/>
  <rect x="40" y="70" width="250" height="26" rx="10" fill="#2c2c2c"/>
  <text x="54" y="88" fill="#c9c9c9" font-size="12">参考视频</text>
  <rect x="58" y="108" width="214" height="86" rx="6" fill="#2f2f2f"/>
  <text x="165" y="156" fill="#8a8a8a" font-size="12" text-anchor="middle">已有内容的媒体</text>
  <text x="165" y="176" fill="#6f6f6f" font-size="11" text-anchor="middle">本地上传 / 截取帧产出</text>

  <!-- target node -->
  <rect x="590" y="70" width="250" height="150" rx="10" fill="#232323" stroke="#4a90d9" stroke-width="1.5"/>
  <rect x="590" y="70" width="250" height="26" rx="10" fill="#2c3550"/>
  <text x="604" y="88" fill="#cfe3ff" font-size="12">视频 1（空节点）</text>
  <rect x="608" y="108" width="214" height="86" rx="6" fill="#2a2a2a" stroke="#3a3a3a" stroke-dasharray="4 3"/>
  <text x="715" y="150" fill="#8a8a8a" font-size="12" text-anchor="middle">等待生成</text>
  <text x="715" y="170" fill="#6f6f6f" font-size="11" text-anchor="middle">选中即弹出生成面板</text>

  <!-- edge -->
  <path d="M 292 145 C 420 145, 462 145, 588 145" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <path d="M 588 145 l -14 -6 l 0 12 z" fill="#4a90d9"/>
  <circle cx="292" cy="145" r="4.5" fill="#4a90d9"/>
  <circle cx="590" cy="145" r="4.5" fill="#4a90d9"/>

  <text x="440" y="128" fill="#8fc0f0" font-size="12" text-anchor="middle">参考连线</text>
  <text x="440" y="176" fill="#6f8fb0" font-size="11" text-anchor="middle">方向 = 参考 → 生成目标</text>

  <!-- handles hint -->
  <text x="292" y="205" fill="#5f5f5f" font-size="10" text-anchor="middle">+ 手柄</text>
  <text x="590" y="205" fill="#5f5f5f" font-size="10" text-anchor="middle">+ 手柄</text>

  <!-- rule box -->
  <rect x="40" y="262" width="800" height="106" rx="8" fill="#1c1c1c" stroke="#333" stroke-width="1"/>
  <text x="60" y="288" fill="#d8d8d8" font-size="13" font-weight="600">方向决定语义</text>
  <text x="60" y="313" fill="#a8a8a8" font-size="12">· 从带内容的节点拖到空节点 = 把对方当作参考，空节点是生成目标</text>
  <text x="60" y="334" fill="#a8a8a8" font-size="12">· 有就绪参考时，即使不写提示词，「生成」也会变为可用——参考本身就是一种输入</text>
  <text x="60" y="355" fill="#a8a8a8" font-size="12">· 并非任意两类节点都能互连：不可连的组合在 + 菜单里直接标注「无法连接这些节点」并禁用</text>
</svg>
