<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="t d" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <title id="t">选中不同状态时上方浮动工具条的内容</title>
  <desc id="d">矩阵图：选中视频节点、图片节点、空节点、文本节点、多个节点、编组时，浮动工具条分别显示不同条目。</desc>

  <rect width="880" height="470" fill="#141414"/>

  <text x="24" y="34" fill="#eaeaea" font-size="15" font-weight="600">选中什么，就出现什么工具条</text>
  <text x="24" y="55" fill="#8a8a8a" font-size="11.5">工具条反映节点当前状态，不是固定菜单。找不到某个按钮时，先确认自己选中的是什么。</text>

  <!-- header row -->
  <rect x="24" y="72" width="832" height="30" rx="5" fill="#232323"/>
  <text x="38" y="92" fill="#9a9a9a" font-size="11.5" font-weight="600">选中的状态</text>
  <text x="250" y="92" fill="#9a9a9a" font-size="11.5" font-weight="600">浮动工具条 / 面板内容</text>
  <text x="690" y="92" fill="#9a9a9a" font-size="11.5" font-weight="600">会消失吗</text>

  <!-- row 1: video -->
  <rect x="24" y="108" width="832" height="46" rx="5" fill="#1b1b1b"/>
  <text x="38" y="136" fill="#e0e0e0" font-size="12.5">视频（带媒体）</text>
  <text x="250" y="136" fill="#c9c9c9" font-size="11.5">局部重拍✦ 智能超清✦ 视频编辑✦ 截取帧∨ 视频修剪 工具∨ ｜ 全屏 下载</text>
  <text x="690" y="136" fill="#7f7f7f" font-size="11">点空白即消失</text>

  <!-- row 2: image -->
  <rect x="24" y="160" width="832" height="46" rx="5" fill="#1b1b1b"/>
  <text x="38" y="188" fill="#e0e0e0" font-size="12.5">图片（带内容）</text>
  <text x="250" y="188" fill="#c9c9c9" font-size="11.5">智能改图✦ 扩图 智能超清 抠图 多角度 工具∨ ｜ 全屏 下载</text>
  <text x="690" y="188" fill="#7f7f7f" font-size="11">点空白即消失</text>

  <!-- row 3: empty -->
  <rect x="24" y="212" width="832" height="46" rx="5" fill="#1b2a1b"/>
  <text x="38" y="240" fill="#cfe8cf" font-size="12.5">空节点（无内容）</text>
  <text x="250" y="240" fill="#bcd8bc" font-size="11.5">不弹工具条，改为节点下方弹出生成面板（按文本/图片/视频/音频分别不同）</text>
  <text x="690" y="240" fill="#7f9a7f" font-size="11">随取消选中关闭</text>

  <!-- row 4: text -->
  <rect x="24" y="264" width="832" height="46" rx="5" fill="#1b1b1b"/>
  <text x="38" y="292" fill="#e0e0e0" font-size="12.5">文本节点</text>
  <text x="250" y="292" fill="#c9c9c9" font-size="11.5">背景色 ｜ 全屏 ｜ 下载</text>
  <text x="690" y="292" fill="#7f7f7f" font-size="11">点空白即消失</text>

  <!-- row 5: multi -->
  <rect x="24" y="316" width="832" height="46" rx="5" fill="#1b1b1b"/>
  <text x="38" y="344" fill="#e0e0e0" font-size="12.5">多个节点（框选）</text>
  <text x="250" y="344" fill="#c9c9c9" font-size="11.5">N 节点 ｜ 编组 ｜ 布局∨ ｜ 下载 ｜ Add tags</text>
  <text x="690" y="344" fill="#7f7f7f" font-size="11">点空白即消失</text>

  <!-- row 6: group -->
  <rect x="24" y="368" width="832" height="46" rx="5" fill="#1b1b1b"/>
  <text x="38" y="396" fill="#e0e0e0" font-size="12.5">编组（组卡片）</text>
  <text x="250" y="396" fill="#c9c9c9" font-size="11.5">解除编组 ｜ 布局 ｜ 背景色 ｜ 下载</text>
  <text x="690" y="396" fill="#7f7f7f" font-size="11">点空白即消失</text>

  <!-- footnote -->
  <rect x="24" y="424" width="832" height="30" rx="5" fill="#241c14" stroke="#5a4326" stroke-width="1"/>
  <text x="38" y="444" fill="#e8c89a" font-size="11.5">✦ = VIP/付费标记，点击会提交按积分计费的任务。视频与图片是两套工具条，互不包含对方专属项。</text>
</svg>
