<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-labelledby="t d" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <title id="t">即梦画布界面分区</title>
  <desc id="d">示意图：画布顶栏、左侧节点入口栏、中央画布区、底部视图控件与右下角与 AI 对话按钮的位置。</desc>

  <rect width="880" height="430" fill="#141414"/>

  <!-- canvas surface -->
  <rect x="96" y="62" width="700" height="300" rx="8" fill="#1a1a1a" stroke="#2e2e2e" stroke-width="1"/>

  <!-- top bar -->
  <rect x="96" y="24" width="700" height="30" rx="6" fill="#242424" stroke="#3a3a3a" stroke-width="1"/>
  <text x="110" y="43" fill="#b8b8b8" font-size="10.5">返回首页</text>
  <text x="176" y="43" fill="#d0d0d0" font-size="10.5">画布标题</text>
  <text x="236" y="43" fill="#b8b8b8" font-size="10.5">项目</text>
  <text x="278" y="43" fill="#b8b8b8" font-size="10.5">节点 N</text>
  <text x="330" y="43" fill="#8fbf8f" font-size="10.5">已保存</text>
  <text x="386" y="43" fill="#b8b8b8" font-size="10.5">搜索</text>
  <text x="428" y="43" fill="#b8b8b8" font-size="10.5">生成历史</text>
  <text x="492" y="43" fill="#8fb0d8" font-size="10.5">✦ 积分</text>
  <text x="546" y="43" fill="#b8b8b8" font-size="10.5">用户菜单</text>
  <text x="446" y="14" fill="#7a7a7a" font-size="10" text-anchor="middle">顶栏</text>

  <!-- left rail -->
  <rect x="20" y="62" width="64" height="300" rx="6" fill="#242424" stroke="#3a3a3a" stroke-width="1"/>
  <text x="52" y="84" fill="#c8c8c8" font-size="10.5" text-anchor="middle">文本</text>
  <text x="52" y="112" fill="#c8c8c8" font-size="10.5" text-anchor="middle">图片</text>
  <text x="52" y="140" fill="#c8c8c8" font-size="10.5" text-anchor="middle">视频</text>
  <text x="52" y="168" fill="#c8c8c8" font-size="10.5" text-anchor="middle">音频</text>
  <text x="52" y="196" fill="#9a9a9a" font-size="10.5" text-anchor="middle">时间线</text>
  <text x="52" y="224" fill="#9a9a9a" font-size="10.5" text-anchor="middle">主体</text>
  <text x="52" y="252" fill="#9a9a9a" font-size="10.5" text-anchor="middle">导演台</text>
  <line x1="30" y1="266" x2="74" y2="266" stroke="#3a3a3a" stroke-width="1"/>
  <text x="52" y="288" fill="#c8c8c8" font-size="10.5" text-anchor="middle">资产库</text>
  <text x="52" y="316" fill="#c8c8c8" font-size="10.5" text-anchor="middle">上传</text>
  <text x="52" y="376" fill="#7a7a7a" font-size="10" text-anchor="middle">左栏</text>
  <text x="52" y="389" fill="#6a6a6a" font-size="9" text-anchor="middle">悬停展开为图标+文字</text>

  <!-- centre canvas label -->
  <text x="446" y="210" fill="#6a6a6a" font-size="13" text-anchor="middle">中央画布区 · 节点与连线都在这里</text>
  <text x="446" y="232" fill="#585858" font-size="10.5" text-anchor="middle">选择工具下空白拖拽 = 框选；切到抓手工具后 = 平移画布。滚轮上下平移；Ctrl+滚轮 = 缩放</text>

  <!-- bottom dock -->
  <rect x="120" y="322" width="220" height="28" rx="6" fill="#242424" stroke="#3a3a3a" stroke-width="1"/>
  <text x="136" y="340" fill="#b8b8b8" font-size="10.5">选择工具 ⇄ 抓手工具</text>
  <text x="240" y="340" fill="#b8b8b8" font-size="10.5">小地图</text>
  <text x="284" y="340" fill="#b8b8b8" font-size="10.5">显示连线</text>
  <text x="330" y="340" fill="#b8b8b8" font-size="10.5">100%</text>
  <text x="230" y="366" fill="#7a7a7a" font-size="10" text-anchor="middle">底部 dock（视图控件）</text>

  <!-- ai chat -->
  <rect x="640" y="322" width="136" height="28" rx="14" fill="#242424" stroke="#3a3a3a" stroke-width="1"/>
  <text x="708" y="340" fill="#9fc4e8" font-size="10.5" text-anchor="middle">与 AI 对话</text>
  <text x="708" y="366" fill="#7a7a7a" font-size="10" text-anchor="middle">右下角</text>

  <!-- status line -->
  <rect x="20" y="398" width="776" height="26" rx="5" fill="#1c1c1c" stroke="#2e2e2e" stroke-width="1"/>
  <text x="34" y="415" fill="#7f9fbf" font-size="10.5">状态行：N nodes, N edges, N selected. Editable. Room connected. 已保存.</text>
  <text x="34" y="429" fill="#5f7f9f" font-size="9.5">（英文按数量变形：1 个时作 1 node / 1 edge，0 条仍作 0 edges）</text>
</svg>
