个 / 没有工具条」是判据失误**——组节点有 2 个按钮（信息、删除），本批以「清空画布→只建一个组→在画布上直接点」复现（此前组被其他节点压住，点选命中的是压在它上面的节点）。同批复核通过的还有文本 8 / 空图片 4 / 空视频 4 三行，与 M63 一致。正文表、规则③与配套截图均已订正并新增 1 张（共 6 张）。 2026-10-02 M119 把「四角手柄缩放 220×160–1600×1200」坐实，并查明**上下限对手动缩放成立、对上传不成立** 2026-10-02 M125 工具条按钮「三套字符串」逐个实测：**13 个按钮的 aria-label 与实际悬停浮层逐字一致**；★ 挖出手册缺口——**「关掉文字」后，手册按钮表上那 13 个名字在界面上一个都找不到** 2026-10-03 M136 节点工具条两态实测（每种类型建节点、逐按钮 A/B 比对）：查出**手册缺失**——图片节点**无图时工具条只有 4 个**，其余 9 个要等真有一张图才出现 2026-10-03 M137 **逐节点类型实测**（先清空画布只留一个、`elementFromPoint` 阳性对照确认命中）：★ 订正一处手册错误（正文汇总「共 5 种」→ **6 种**，表格每一行都对）；★ **补上一整类缺失**——ComfyUI 工作流节点此前不在对照表里，实测其 4 个按钮是「信息·删除·运行·参数」，与其他空节点的「编辑·上传 X」不同。⚠️ **只测到空节点这一档**——选上工作流之后是几个按钮**未测也不猜**（需本机 ComfyUI）  2026-10-04 M217 一条订正：R60 `04-edit-nodes-multiselect-menu.png` 的 alt 说右键菜单「在右上角弹出」。**菜单开在右键点上，不在任何固定角落**（源码 `canvas-context-menu.tsx:36-37` 是 `left/top = menu.x/menu.y` 再钳 12px）：该图菜单卡片实读 x 583..792、y 532..615，被选中的文本节点是 (458,459)-(705,623)，**菜单左上角落在节点内部**，在画布中部偏左。两条钳制边界都没碰到，故那组坐标就等于右键点。★ 同一份 manifest 的 `step` 写「对『文本』节点**左下侧**右键」也不准（实测在节点内部偏中上），一并改成「右键」。
  - id: connect-references
    title: 连线引用与无线引用两种接法
    role: tdcanvas-creator
    frequency: core
    impact: high
    coverage: flagship
    evidence:
      - type: runtime
        note: '2026-10-03 M177 查清「连线点不中」的真实机制，**并订正手册对它的归因**（R36）。手册原写：连线的可点范围等同于那条贝塞尔曲线本身、不存在加粗命中层——**被证伪**：连线的 path 本身就是 stroke=transparent、stroke-width=16，加上 pointer-events: stroke，**那条「细线」底下就压着一条 16px 的透明命中带**。实测沿法线偏移 d=0~7 命中、d>=8 落空，**命中半宽 7~8 屏幕像素**，是视觉线宽（1~2px）的 4~8 倍；画布缩放实测 100%（CTM 的 a、d 分量均为 1.0、缩放滑块 value=100、节点 220 屏幕像素对 220 世界像素、正文里的 100%，四条读数互证）。★**归因也随之改了**：点不中不是「线太细」，而是**节点盖在上面**——实测节点的 node-element 是 z-10，而连线层是 z-2；41 点采样里 33 点落在节点矩形内，elementFromPoint 命中的正是那个节点。手册的绕法（拖开节点 / Delete）**结论对、理由错**，已改正文。★同批验证手册另外两条**成立**：右键连线弹出 data-canvas-context-menu=connection 的菜单、内容仅「删除」、212px 宽；**不需要先选中**（直接右键与点选后右键结果相同）；点选后按 Delete 实测连线 1 条 -> 0 条，真删掉了。★另记两条探针教训：(a) getPointAtLength 返回的是 **SVG 用户坐标**，而 elementFromPoint 要**屏幕坐标**，混用两套坐标系会让**每个点都落在画布空白上**（d=0 也命中 DIV.h-full），必须先过 getScreenCTM()；(b) 菜单根标记是 **data-canvas-context-menu** 这个 data 属性，按 class 里的 context-menu 找会**一个都找不到**——「按 class 找菜单」读出「右键没反应」，差点当成产品缺陷。'
      - type: runtime
        note: 2026-09-26 端口拖拽连线（贝塞尔即时生成、related 高亮）实测成功。
      - type: static
        note: 拖线到空白弹创建菜单、@mention chip 序列化、objects 模式清空连线、pinned 版本引用。
