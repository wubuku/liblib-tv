        note: 2026-10-02 M118 把「小地图纯 div 240×160、点击/拖拽导航」从静态升级为运行时。① **外层实测 240×160**（账本正确；内容层 238×158 是 1px 边框内衬），**滚轮放大缩小后仍恒为 240×160**（components/canvas/canvas-mini-map.tsx:12-13 硬编码）。② **点击=把该点设为视口中心**：点小地图内 (60,47)，视口框中心读数 (60,47)，偏差 0；**拖拽跟手**，拖到 (179,111) 松手框中心读数 (179,111)；导航前后视口框宽 118→118，**不改缩放**。③ **scale 算法三方交叉验证**：两节点相距 (650,330)，源码 :25-35 把包围盒**各外扩 500 世界单位**、:39 等比取 min(240/boundsW,160/boundsH)，手算 0.09816 = 实测反推 0.09816，方块 left 手算 62.58 对上实测 62.5767——**这也解释了「节点在小地图上显得很小、四边留白」**。④ ★**新发现：它固定压在画布左下角**（:99 的 absolute bottom-24 left-6，实测 (24,744)-(264,904)，不避让节点），压住的节点 **elementFromPoint 直接命中小地图层、点选后按 Delete 节点数 3→3 删不掉**，而同批空白处对照节点 3→2 正常删除且可撤销复位；被压住的节点上也找不到输出端口元素（与 M97「端口需先悬停源节点才激活」同源）——**点不中/选不中/删不掉/连不上同一原因**。已在正文新增专节给出两种解法（关小地图最快、挪走节点）与「撤销救不了」的连带提醒。同批**如实记一组作废读数**：连线测试的阳性对照同样失败（端口坐标 (1200,130) 明显不在源节点右边缘），故其三行「连不上」结论一律作废不进结论。
