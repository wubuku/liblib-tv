        note: 2026-10-02 M119 把「四角手柄缩放 220×160–1600×1200」从静态升级为运行时，**两个数字都精确坐实**。先证 k=1（新节点 DOM 尺寸 520×300 恰等于 NODE_DEFAULT_SIZE 文本常量，且下限实测 220×160 恰等于 CANVAS_NODE_RESIZE_LIMITS 世界常量，两条独立读数互证）。往右下猛拖 → **精确停在 220×160**（两次独立测得）；把节点左上角挪到视口上方、用**右下角手柄**往右下猛拖 → **精确停在 1600×1200**。另测出：★**尺寸不走网格吸附、位置走**（220 不是 16 的倍数，实测就是 220 而非 224）；文本节点**不锁比例**（只横拖即可把宽高比从 1.516 改成 1.649）。★**订正账本两处措辞**：① 「缩放限制」实为**节点尺寸**限制——同句并列的「缩放」易被读成画布缩放（那个范围是 5%–500%，M108 已测）；② 220×160–1600×1200 **只适用于手动拖手柄，上传路径可突破**。★**实测上传 2000×100（20:1）的图 → 节点 640×160（4:1），比例被强行改变**，机制与源码手算逐字一致（project.tsx:165-172 的 fitMaterialPreviewSize，调用点 :1566 传 min=220,160）：先等比缩放得 640×32，grow=max(1,220/640,160/32)=5 撑成 3200×160，shrink=0.2 压回 640×32，最后一道 Math.max(minHeight,…) 只兜高度不兜宽度，于是高度落在 160——**任何足够扁的图上传后都会变成 640×160**。★**视频上传用另一组下限**（:1586 传 320,180，故视频节点最小 320×180、图片 220×160），而手动拖手柄时两者又都回到 220×160（components/canvas/canvas-node.tsx:263），这解释了「视频节点天然比图片节点大」。另记一条**未实测**的源码边界：lib/canvas/canvas-node-size.ts:27-28 的 minRatioWidth 在比例极扁且锁比例时会小于 minWidth 220，本批因需先勾出锁比例工具而未构造。同批记取证教训：用 top-left 手柄放大后节点左上角被拖出视口、手柄够不到，「尺寸不再变化」实为拖拽没生效而非 clamp 生效——**「操作没做成」与「结果就是那样」必须区分**。
