    evidence:
      - type: runtime
        note: '2026-10-03 M175 复验本任务「顶栏 11 个可点、9 个有名字、2 个什么都不给」这条断言：**M175 当时量到的 9/2 是对的，我的判据连错三次**。① 第一版把 aria-label 算进「有名字」，读出 11 个全有名字；② 第二版意识到 aria-label 不弹提示，改用悬停找 ant-tooltip 浮层，却把**按钮自身**（class 含 inline-flex、文字与按钮相同）当成了浮层，又取 fresh[0]——**那恰好是上一个按钮（主页）没销毁的浮层残留**；③ 换成 role="tooltip" + 过滤 shown，两轮独立悬停各等 1600ms，才读准。★**2026-10-05 M249 订正的是「11 个可点」这个前提，不是 9/2**：M175 量的是**右侧 Agent 面板打开**那个状态；**默认收起状态下顶栏只有 10 个真收得到指针的**（那根把手整条落在视口外、所在容器 pointer-events 为 none），且**左侧面板右缘另有一根同样点不到的把手**。**M175 的判据没错，错在它默认了一个状态。**
        终读数：title 非空 6（双击修改画布名称 / Codex 未连接 / 配置 / 切换到浅色主题 / 查看版本更新 / 快捷键）+ antd 浮层 3（主页 / 切换到 English / Agent）= **9 有名字**；**两者都无 2**（lucide-menu 画布菜单 @78、拖把手 @1601，aria 分别是「打开画布菜单」「调整右侧面板宽度」）——与手册逐字吻合。★**三条判据教训（本批最值钱的产出）**：(a)「有名字」有三个来源（title 原生提示、antd Tooltip 浮层、可见文字），**静态读属性只能看到一个**，必须实际悬停；(b) 多个候选取第一个是陷阱，浮层会残留，要么按判据过滤要么用 role="tooltip" + shown；(c) **aria-label 不是悬停提示**，它是给读屏软件的，鼠标停上去不弹。同批复验另一条同样成立：/config 说明栏（w=260）内可点元素 0、整页 role=tab 4 / tablist 1、4 个 tab 全归 Agent 面板——手册在 20-reference.md 与 90-troubleshooting.md 两处都写对了。★**2026-10-05 M249 回看这一格，发现读数里已经写着答案却被自己放过了**：M175 记的拖把手坐标是 **@1601**，**而视口宽度正好是 1600**——**那根把手当时就已经整个在窗口外面**，却被算进了「顶栏 11 个可点」里的第 11 个。**一个坐标读数摆在纸上，只要不拿它去和视口宽比一次，就等于没读**（同 M244「弹窗 6 vs 整页 6」那一族）。'
      - type: runtime
        note: 2026-09-26 ?mode=new 自动创建 /canvas/:id、默认标题 TDCanvas 2、空态引导与 Dock 结构截图核实。
      - type: runtime
        note: '2026-10-02 M126 查左侧 Dock 的可发现性：16 个按钮逐个实测，**可见文字 0 个、title 属性仅 1 个、悬停提示只有 6 个**，而**其余 9 个（打开画布菜单、添加节点、搜索节点、资产、提示词库、历史、上传资产、画布外观、清空画布）悬停也没有任何提示**——界面上任何地方都不显示它们叫什么。整列唯一可见文字是「＋」上的「新建」徽标与滑杆读数（实测 91%）。★★**「清空画布」与节点工具条的「裁剪」svg class 逐字相同**（均为 lucide lucide-scissors size-4），**且选中图片节点时二者同屏出现**，而前者不可逆。★**「删除选中」只在单选时出现**：未选中 15 → 单选 16 → Shift 多选后回到 15，故多选删除必须走画布右键菜单；该按钮本身可见文字空、title 为 null、悬停浮层也是 null。另记「＋ 新建」的可见徽标写「新建」而 aria-label 是「添加节点」，为「三套字符串不一致」的第三例。'
