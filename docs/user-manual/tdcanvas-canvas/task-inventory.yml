        note: 2026-10-02 M101/M102 逐条实测组的四条行为。① **徽标是真计数不是「有无成员」**：把只做过一次的「0→1」补成完整序列 0→1→2→1→0——只测 1 个成员时两种假设给出完全相同的观察，无法区分。② **节点新建出来就落在组框内不算入组**，必须真的拖一次，做了「几何完全相同、只差拖没拖过」的对照实验（0 vs 1，两次连读一致）。③ **删组不删成员**：2 成员组删框后成员全部存活且位置不变，撤销恢复组且徽标回到 2。④ **删成员不删组**，徽标 2→1 可撤销；**组不能套组但成员会改投**，两框重叠时改投后合计守恒。所有拖拽前均用 elementFromPoint 阳性对照确认抓点。
