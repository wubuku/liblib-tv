    review_note: 2026-09-27 描述型成稿（付费红线）：生成面板字段运行时取证（模式/输入/参数 1K/2K/模型 Seedream V5 Pro/参考素材区），状态机与停止≠取消来自源码+官方文档；运行点击未执行。 2026-10-01 M66 订正生成面板对照表三处错误（本批最重要的发现）：**文本节点的面板不是生图面板**。手册此前把「文本 / 图片」并成一行「图像创作 / Seedream V5 Pro / 约 ¥0.519」，**三项全错**——①「图像创作」这个词在 i18n zh-CN 与全部源码中各出现 **0** 次，界面上根本不存在；② 文本节点挂的是「文本创作 / 文本处理」面板，跑对话模型 **Kimi k3**（输入框占位「输入你希望模型回答的内容」，参数「使用模型默认参数」，最大输出长度 1024）；③ **文本面板根本没有价格**，底部只写「按实际结算」——照旧表算账会把文本生成当生图计价。**源码佐证**：`aitudou-native-generation.ts` 的 `DEFAULT_OPERATION_BY_KIND` 写明 `text: "text.chat"`（其余为 image/video/audio.generate），`aitudou-native-generation-panel.tsx` 的 `nativeAutomaticMode` 文本分支返回「文本处理」。**顺带订正**：视频面板「文本生视频」应为「**文生视频**」，参数补上「4~15 秒 · 480p/720p/1080p/2k/4k」范围（5 秒只是默认值）；音频一行经复测**正确**，予以保留。**四类节点逐个实测**（干净 profile，空画布中央芯片建节点）：文本=文本创作/文本处理/Kimi k3/无价格；图片=文生图/Seedream V5 Pro/约 ¥0.519；视频=文生视频/Seedance 2.0 Standard/约 ¥2.48–5.37；音频=音频创作·文本生成音频/Doubao seed audio 1.0/约 ¥0.004/秒。**附带发现**：文本节点右上角的「生图」按钮**不是打开生图面板**，而是拿该节点当提示词去生图；节点为空时点它只弹 toast「⚠ 文本节点为空，无法生图」，什么也不发生。已新增专节 + 配图 `09-generate-images-text-panel.png`，并同步订正 `20-reference.md` 的同一张表。 2026-10-01 M82 复验四个价格数字**全部未漂移**（第 15 次否证），面板标题与默认模型逐字一致；**订正分辨率档位 5→7**（此前漏了 native1080p / native4k，而这正是价格区间的两端），并补记价格来自 `GET /tdtv-api/aitudou/api/pricing` 实时接口、文本面板「读取价格…」中间态。新增 1 张视频面板参数行截图。
