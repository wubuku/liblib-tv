    review_note: '2026-10-03 M166 该图已重拍、菜单名改为当前的「引用该节点生成」（原 09-27 拍的图上还是旧文案「利用画布节点生成」，全仓源码与 i18n 已 0 命中；视口随之从 1280x720 改为 1600x700，因为有内容图片节点的工具条恒 1285px 宽、1280 视口永远放不下）。更早的记录：2026-09-27 拖线到空白弹「利用画布节点生成」上下文菜单（按视频上游给出 文本/图片/视频生成+音频参考 四项）运行时取证；连线建立/删除/撤销此前已证。@mention chip 留 Gate B。 2026-10-01 M60 补齐第三条右键菜单：此前全册只对「空白处」与「节点上」两个菜单做过取证，**连线右键菜单从未取证**（正文仅 15 字一句带过、无图）。实测 `data-canvas-context-menu="connection"`，菜单**只有「删除」一项**（212x50 框），与源码 canvas-context-menu.tsx:84-85 的 `{menu.type === "node" ? <复制> : null}` + 删除完全吻合。另实测连线可点击区域就是贝塞尔曲线本身、无加粗命中层，**被节点盖住时鼠标怎么点都弹不出连线菜单**（elementFromPoint 恒命中节点）——已作为易错点写入正文。 2026-10-01 M61 文案普查抓到两处漂移：① 拖线到空白处的创建菜单，手册与配套截图写「利用画布节点生成」，而**当前 v0.14.0 界面写的是「引用该节点生成」**——i18n `canvas.createMenu.fromNode` 与 dist 产物 app-Djk_0pPR.js 均只有新文案、全仓零处旧文案，说明截图拍自更早版本。正文已改为新名并显式说明「换过名字」，两张图的 alt 同步标注版本差异（重拍需复现一个自动化难复现的拖放手势，按 M53 不为凑图硬拍）。② 同一操作在两处叫法不同：画布节点工具条写「存资产」，提示词库卡片写「加入我的资产」，已在 use-prompt-library 加辨析。 2026-10-02 M112 连线引用相关实测'
