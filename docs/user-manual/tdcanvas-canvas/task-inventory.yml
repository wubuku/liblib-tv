    review_note: 2026-09-27 运行时走查完成（双击标题重命名、双击编辑文字追加、删除→历史flyout撤销恢复、信息面板字段核实）；缩放手柄拖拽精度不足留待 Gate B 补验；发现多标签同项目编辑互相覆盖（已写入手册排障）。 2026-10-01 M63 逐节点实测悬浮工具条并重写该页开头的对照表（原表只列图片/文本/视频三类、漏掉「信息」「删除」两个公共项，也未说清组节点没有工具条）。实测结论：文本 8 个（信息 删除 存资产 编辑 编辑文字 生图 缩小 放大）、空图片 4 个、空视频 4 个、**有内容图片 13 个**、**组 0 个（无工具条）**。**空节点与有内容节点差 9 个按钮**是本批最有用的发现——解释了"同一个节点前后按钮不一样多"。另实测「存资产」按钮的 label 是「存资产」而 title 是「加入我的资产」，为 M61 的两处叫法不同提供了运行时实证。**关键：M63 一度用被 M48 污染的 profile 测出图片工具条 14 个（含多角度），换全新空白 profile 复核为 13 个（无多角度），M48 结论成立**——共享 profile 状态污染（M57 教训）在此再次应验。 2026-10-01 M64 补「多选」这一节：手册此前只在 shortcuts-help 的键位表里列了框选/追加/全选三个键位，**从没说过多选状态下能做什么**。实测五项结论：单选 1 个时工具条 8 个按钮、**多选 2 个时工具条整个消失**（源码 project.tsx:633-634 `selectedNodeIds.size === 1` 独立佐证）、多选态右键仍是「复制/删除」两项**与单选完全相同无批量项**、多选按 Delete 一次删光 2 个节点、Cmd+Z 一次撤销全部恢复。即**这个版本没有批量编辑能力**，多选真正省事的只有整组拖动与整组删除。已写入 edit-nodes 新小节 + shortcuts-help 键位表下方提示 + 90-troubleshooting 新排障条目（原第 15 行"悬浮工具条不见了"只写了"拖到中间"一种原因，漏了多选这条更常见的）。 2026-10-01 M65 回答 M64 留下的问题——**多选态右键「复制」到底复制几个**。实测两轮（先在 2 节点画布，后在 4 节点画布只选中 2 个）：**右键「复制」一律只复制右键命中的那一个**（2→3、4→5），**`Ctrl / Cmd + C / V` 才复制全部选中**（2→4、4→6，只多出被选中的 2 个，证明它复制的是"选中的"而非"画布上全部"）。源码双向佐证：`project.tsx` 右键菜单 `onDuplicate` 只取 `contextMenu.nodeId` 调单节点的 `duplicateNode(nodeId)`，全程不读 `selectedNodeIds`；多选复制由另一处 `copySelectedNodes` 承担，挂在 `Ctrl / Cmd + C / V` 上。**M64 正文"右键菜单与单选完全相同"只说了外观，这轮补上了行为差异**——外观相同但复制结果不同，且菜单没有任何"当前多选了 N 个"的提示，是本批最有价值的发现。同时订正 shortcuts-help 一处不准确说法：原文把 `Ctrl / Cmd + C / V` 写成「复制所有节点」的"等价写法，只是多两步"，实测二者作用对象不同。 2026-10-01 M65 附带发现**手册自身两处 Markdown 表格被插在中间的引用块/列表劈开**：`shortcuts-help.md` 的「弹窗里的十三条」后 5 行渲染成原始管道文本（该页却宣称"逐字抄录，一行不落"）、`AUDIT.md` 有 61 行同型问题。两处均已修，并新增第十道门禁 `scripts/check-tables.py`（详见 AUDIT 同批记录）。 2026-10-01 M65 探针教训两则：**(1) 工具条判据用错了 title**——按 M63 记录的 label 写 `button[title="编辑文字"]` 恒为 0，M63 实测的 title 实为「编辑文本」，差一个"字"字导致整轮判据失效，差点误记成"多选时工具条仍在"；**(2) 单击文本节点中心会展开「文本生成面板」**（内含「输入你希望模型回答的内容」、模型选择 Kimi k3、「流式输出 否 / 最大输…」、「开始生成，按实际结算」），缩放与平移都不触发、只有单击触发，截图构图会被它污染——这不是 Agent 面板，两者位置与关闭方式都不同。 2026-10-01 M80 复测定正：悬浮工具条表**「组 = 0 个 / 没有工具条」是判据失误**——组节点有 2 个按钮（信息、删除），本批以「清空画布→只建一个组→在画布上直接点」复现（此前组被其他节点压住，点选命中的是压在它上面的节点）。同批复核通过的还有文本 8 / 空图片 4 / 空视频 4 三行，与 M63 一致。正文表、规则③与配套截图均已订正并新增 1 张（共 6 张）。
