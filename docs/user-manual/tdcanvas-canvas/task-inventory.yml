      - type: runtime
        note: 2026-10-02 M116 把「180ms 合并 / 拖拽合并 / 上限 50」三条全部从静态升级为运行时。① **上限正是 50，精确**：连做 55 次上传（每次间隔 >180ms 防抖窗口以保证各自成一条）得 55 个节点，连按撤销到撤不动为止**剩 5 个 = 55−50，实际可撤销条数 = 50**；redo 全部走回 55，重做栈不受上限影响。② **拖拽整段合并为一条，精确**：14 帧拖拽位移 Δ=(448,−144)，撤一次**残差 (0,0)**——若每帧各成一条，残差应为 Δ×13/14≈(416,−134)；再撤一次节点直接消失，证明栈里正好是「创建」+「拖拽」两条。源码定界 project.tsx:406/420/425（clearTimeout+setTimeout 180ms；past=[...past.slice(-49),last]）、拖拽期间 historyPausedRef=true（:1362/:1391，:406/:441 读取）。同批记一条方法论：第一版探针把「撤 2 次后位置变了」当成「拖拽被拆成多条」，实际那正是**节点的创建位置**——判据 2 依赖了「撤完拖拽栈里应只剩 1 条」这个未经验证的假设。
