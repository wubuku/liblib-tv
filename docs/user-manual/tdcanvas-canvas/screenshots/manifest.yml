# TDCanvas 用户手册 · 截图清单
#
# ★ **读这份清单的人请先看这一段（M203 新增）**：
#
# 1. **`verified_locator` 记的是「这张图拍下来时读到了什么」，不是「产品现在是什么样」。**
#    同一条目里如果有 `m160_correction` / `m1xx_note` 这类字段，**它覆盖同条的
#    `verified_locator` 与 `alt`**——那里面是已被实测推翻的读数，**保留它们是为了留下
#    订正史**（`04-icon-reuse-same-screen.png` 就是这种：像素坐标与 931 像素距离已作废，
#    因为左侧 Dock 钉死在屏幕上、节点工具条跟着节点跑，距离不是界面属性）。
#    **只读 `verified_locator` 一个字段就下结论，会拿到过期数字。**
#
# 2. **两种订正写法各有适用场景，不要混用**：
#    - **原值已被推翻、且原值本身没有取证价值** → 直接订正 `verified_locator`
#      （`00-dock-icon-only.png`：R44 订正后仍写着「8 个按钮 / 删除选中仅单选时出现」，
#      本批已按 M57 的先例直接改掉）；
#    - **原值记录的是当天那张图的取证过程、改掉就看不出当时量到了什么** →
#      保留原值 + 加 `*_correction` 字段（`04-icon-reuse-same-screen.png` 的 M160 就是
#      有意这么做的，理由写在它自己的 `m160_correction` 里）。
#
# 3. **同一条目的 `alt` 与正文引用处的 alt 不必逐字相同**：本文件的 `alt` 是
#    「这张图拍到了什么」的取证记录，正文里的 alt 是给读者看的描述，措辞本就该不同。
#    但**事实层面必须一致**（同一个数量在两处不能打架）——M202/M203 各查过一轮。

