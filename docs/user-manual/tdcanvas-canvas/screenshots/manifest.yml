# TDCanvas 手册截图登记（manifest）

> schema 对齐 frameos-canvas/screenshots/manifest.yml：每张正式截图必须
> 文件存在 + 本表登记 + 正文描述性 alt 引用 + 真实 SHA-256 四者齐备。
> 约定：文件名 `NN-task-slug-step.png`（NN=任务序号，对应 task-inventory id 顺序）；
> viewport 固定 1440×900；登记时间 ISO 日期；sha256 用 `shasum -a 256` 计算。
> 状态：scaffold——尚无正式截图（逐任务探索阶段开始后填充）。

