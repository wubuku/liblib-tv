    m228_note: 'M228 核 `verified_locator` 时从「纯行为描述、不是定位器」这一类入手（本条原值只有「节点整体位移」6 个字，与 R76 同型）。★ **顺带查出三处正文级错误**：① 缩放手柄是 `absolute z-50 size-7` 的**透明命中区**（`background: rgba(0,0,0,0)` / `border: 0px` / `box-shadow: none` / `border-radius: 0px`），运行时四个角**零可见像素**——手册原写「四角出现圆形缩放手柄」；② 框边那圈**可见**圆点是**连线端口**（`size-3 rounded-full border-2`，12px、2px 描边、cursor 为 crosshair），拖它拉连线而不是缩放；③ 命中区严格等于 `28 × 缩放%`（25%→7、50%→14、76%→21.3、100%→28、150%→42、200→56），而角上唯一的可发现性线索是**光标变 `cursor-nwse-resize`**。正文改法见 R80（角上无可见手柄）、R81（框边圆点是连线端口）、R83（图注别承诺图上没有的手柄）。'

