# LibTV 画布用户手册 · 任务实施账本
#
# 本文件是「哪些用户任务进了手册、验证到什么程度」的唯一权威。
# 每项 status 的含义：
#   verified    —— 已在真实运行界面逐条走查，DOM/网络证据齐全
#   partial     —— 界面文案与结构已坐实，但流程未跑完（原因写在这里）
#   excluded    —— 本轮不写（原因写在这里），不是「测不了」的托词
manual_version: 1

target:
  app: libtv
  name: LibTV
  url: 'https://www.liblib.tv'
  canvas_route: '/canvas?spaceId={spaceId}&projectId={projectId}'
  app_version: '首页左下角显示「版本更新记录 v1.5」；本轮取证 2026-10-01'
  audience:
    - libtv-creator        # 普通创作者：建节点、连线、生成
    - libtv-heavy-creator  # 重度创作者：整理、多画布、资产管理
  depth: thorough
  viewport: '1440x810 @2x，zh-CN，Asia/Shanghai，深色主题（站点默认），reduced-motion'

scope_authorization:
  user_confirmed: true
  note: >-
    用户以 /goal 指令要求「执行 LibTV 画布相关功能的用户手册编写任务，直到全部写完」，
    并明确「不要停下来询问和等待用户回复」「只要主动寻找可以执行的任务就总是有事可做」。
    据此视为对 SKILL §2「Agent 依证据自行定级」的常设授权：候选表在本文件与 PROGRESS.md
    持续可见，用户可随时要求重排。手册不因「没问过用户」而缩减范围。

safety:
  paid_actions_forbidden: true
  note: >-
    测试账户余额 20 积分。本轮全程**未提交任何生成**：所有生成类节点只验证到
    「参数填好、提交按钮在哪儿」为止，一次都没有点。依据 SKILL §0 与仓库 AGENTS.md。
  never_done:
    - 点「生成 / 发送 / 开始拉片」等任何会消耗积分的按钮
    - 发布作品、对外分享链接、发送任何外部通知
    - 充值、开通会员、进入支付页
    - 删除用户自己的项目（删除只在一次性测试项目里对新画布做过）
  user_session_untouched: true
  note: >-
    用户当时正用 CDP 9222 上的有头浏览器编辑 projectId=a860e1da8e9e4504bececda022386429。
    取证全程另起无头浏览器 + 一次性项目，从未 attach、从未改动该项目。

evidence_base:
  runtime:
    - '本目录 tools/*.mjs 全部为无头浏览器实跑脚本，原始输出落在 tools/.evidence/*.json'
    - '每个 .json 记录 visible_text（DOM 真实文案）+ evidence（按钮/输入项/网络请求）'
  repo_docs:
    - 'docs/CANVAS_NAVIGATION.md（clone 侧导航权威，用于与源站交叉核对）'
    - 'docs/research/liblib-canvas-sampling-2026-09-06/README.md（源站单编辑者锁、画布下拉旧结构）'
    - 'docs/research/LIBTV_SHORTCUT_RUNTIME_CROSSWALK.md（clone 侧快捷键交叉表）'
  screenshots: 'screenshots/manifest.yml（102 张，逐张 sha256）'

tasks:
  # ───────────── 入口与组织 ─────────────
  - id: create-project
    title: 从首页或项目页新建项目并进入画布
    role: libtv-creator
    frequency: core
    impact: high
    coverage: flagship
    status: verified
    evidence:
      - 'A1-home-overview.png：首页左栏「新建项目」、主区「新建画布创作」'
      - 'A2-projects-list.png：/project 页「回收站」「新建文件夹」「开始创作」'
      - '实测：在 /project 点「新建项目」**无对话框**，直接进入一张名为「未命名工作区」的新画布'
    manual_pages:
      - 00-quickstart.md
      - 10-tasks/enter-canvas.md
    notes: >-
      与很多工具不同，这里没有「先填名字再建」的对话框——点下去就已经建好并跳进去了，
      名字之后再改。正文必须写清这个差异，否则用户会以为按钮坏了。

  - id: manage-canvases
    title: 画布的新建 / 切换 / 重命名 / 复制 / 删除
    role: libtv-heavy-creator
    frequency: core
    impact: high
    coverage: flagship
    status: verified
    evidence:
      - 'A8a-canvas-dropdown-rows.png：下拉行 aria-label =「切换到画布 {名称}」'
      - 'A9a-dropdown-before / A9b-duplicate / A9c-delete-confirm / A9d-after-delete.png'
      - '网络：重命名发出 POST /api/canvas/project/update'
      - 'batchAQ：**行菜单逐行坐实** —— 在同一张下拉里连点第 1/2/3 行的 `aria-label="更多操作"`（24×24 按钮），三次读出的浮层内容**逐字一致**：`在新窗口打开 / 重命名画布 / 复制画布 / 删除画布`，只有这四项、无第五项、无图标无分组线，且**不随行变化**（活动画布、已改名画布读数相同）'
      - 'batchAR/AR2：**「在新窗口打开」实按**（`ctx.on("page")` 接住 popup，读完 URL 与标题立刻关掉）= **真开新标签页**，页签数 `1→2`；新页 URL 的 projectId 换成**该行画布自己的** id（`1a0e8bb9…`，≠ 原页 `34226ef1…`），标题 `画布 63 - LibTV - 专业视频创作工具`，`.react-flow` 已挂载。**原标签页 URL / 内容 / 节点数全部未变**（`currentUrlChanged: false`）。该菜单项不是 `<a target=_blank>`（`tagOf: BUTTON`，`href`/`target` 均为 null），也**没有弹对话框**（`dialogs: []`）'
    manual_pages:
      - 10-tasks/manage-canvases.md
    findings:
      - '**一张画布 = 一个 projectId**。切换画布时 spaceId 不变、projectId 变（实测 URL 变化）。'
      - '新建命名 `画布 {N}`，插到列表最前并自动切换。'
      - '复制命名 `{原名}副本{序号}`，插在**源画布正下方**，并自动切到副本。'
      - '删除有二次确认「此操作不可恢复」；删掉当前活动画布会自动回落到另一张。'
      - '活动画布行左侧带 ✓ 勾。'

  - id: navigate-canvas
    title: 平移、缩放、小地图与视野复位
    role: libtv-creator
    frequency: core
    impact: high
    coverage: full
    status: verified
    evidence:
      - 'A6-zoom-menu.png：缩放菜单「放大 ⌘+ / 缩小 ⌘- / 适合屏幕 ⌘0 / 缩放至50%·100%·800%」'
      - 'p08-shortcuts-2-suofang.png / p08-shortcuts-3-yidong.png：缩放与移动两组键位'
    manual_pages:
      - 10-tasks/organize-canvas.md
      - 20-reference.md
    notes: '缩放菜单里同时存在「适合屏幕」和三个百分比档，这是实测原文，不是推断。'

  - id: organize-canvas
    title: 整理画布、切换小地图、隐藏连线、网格吸附
    role: libtv-heavy-creator
    frequency: common
    impact: medium
    coverage: full
    status: verified
    evidence:
      - 'D-98-整理画布后.png：按 ⌥⇧F 后节点被铺开'
      - '实测：整理后左下角出现确认条「是否保留此次整理结果？还原 / 保留」'
      - 'batchX：「⋯」菜单内容 = 重命名 / 复制 / 添加到Agent / 删除（四项读完，本轮一个都没点）'
      - 'batchY + AA1：**重命名** = 抽屉那一行就地变成 `input[aria-label="节点名称"]`（219×28，自动聚焦、原名全选），`document.activeElement` 的祖先链命中抽屉容器、**画布节点上没有输入框**；改成「抽屉改名」回车后抽屉行与画布节点标题**同时**变成「抽屉改名」，无成功提示'
      - 'batchY + Z1：**复制** = 副本命名「原名 - 副本」，落在原节点**正下方**（原节点 [578,37,604,340] / 副本 [578,435,604,340]）。**三个时点读数打架：点完立刻数 1 个、⌘0 后数 2 个、刷新页面再数 2 个** —— 抽屉底部「共 2 节点」才是准的，`.react-flow__node` 只数视口内的渲染节点'
      - 'batchY + AA2：**删除** = **没有二次确认**（点完 200/300 毫秒全屏扫 `role="dialog"`，除资产管理抽屉自身外为空），画布节点数立刻 −1；**⌘Z 撤不回来**（把焦点交回画布、`document.activeElement` 变成 `BODY` 后再按，仍是 0 个），`⌘⇧Z` 同样无效，无成功提示'
      - 'batchY + AB + AC：**添加到Agent** = 右侧滑出 TV Director 抽屉（[1024,154,400×640]），**画布节点数不变**，停在欢迎页（`.chat-welcome-root` 仍在 = **没自动发消息**）；节点以**附件 chip** 进输入框，正文编辑区无文字。**实测挂了两个一模一样的 chip**（同一 class、同样 16px 高、无 title/aria/data-* 可区分），1 节点 / 点 1 次，在两张不同测试画布上各复现一次。只挂附件不打字时 `Send` 已 `disabled=false`'
      - 'batchAE0/AI1：「画布」标签工具行是**四枚** —— `搜索节点`(32×32) / `筛选：全部`(32×32) / `所有评级`(80×32) / `展示设置`(32×32)，外加底部 `收起节点侧栏`(32×32)'
      - 'batchAE1：**搜索框平时不存在**，点 `搜索节点` 才展开 `input[placeholder=搜索节点][aria-label=搜索画布元素]`（[38,148,193×20]）。**实时过滤**：输「节点」→ 留 1 行；输「zzz不存在」→ 列表清空并显示「当前画布没有相关搜索结果」；清空 → 全部回来'
      - 'batchAI1：`筛选：全部` 点开 = **按节点类型**筛，10 档（全部/文本/图片/视频/智能剪辑/导演台/逐帧拉片/音频/脚本/剧本），菜单 180×374。选「文本」后列表 3 行 → 1 行，按钮 aria 变成 `筛选：文本`'
      - 'batchAD2：`所有评级` 点开 = **按星级**筛，6 档（所有评级✓ / 1⭐ / 2⭐ / 3⭐ / 4⭐ / 5⭐）。选「1」后列表 1 行 → 0 行。**与 `筛选：…` 是两个独立控件**'
      - 'batchAE3/AF1：`展示设置` 四项 = 列表展示 / **宫格展示** / 展开全部分组 / 收起全部分组。**宫格展示实测成立**：列表变 `div.grid.grid-cols-3.gap-0.5` 卡片（缩略图+节点名），工具行图标从 ☰ 变 ⊞，切回列表展示正常'
      - 'batchAF4/AI：「资产」标签工具行 = `搜索` / `批量操作` / `筛选` / `创建` / `管理`(aria=资产管理)。`搜索` 展开 `input[placeholder=搜索资产]`；`筛选` 开真面板（重置 + 六个标签胶囊：新建标签/角色/场景/物品/风格/音效 + 取消/应用）；`创建` 下拉 = 新建文件夹 / 上传资产；`批量操作` 进勾选模式（底部「共 1 节点」→「已选择 0 项 共 1 节点」）；**`管理` 点开无浮层、无任何可见变化**'
      - 'batchAP1：缩放菜单 = [165,478,189×278]，触发点是左下角那段**百分比文本本身**（`innerText` 就是 `211%`、可点击元素是 BUTTON、40×28）。菜单顶部是一个**真能敲的输入框** `input[aria-label="缩放比例"]`（[181,491,146×20]，type=text），下面六行：放大 `⌘+` / 缩小 `⌘-` / 适合屏幕 `⌘0` /（分隔线）/ 缩放至50% / 100% / 800%'
      - 'batchAP2：**输入框可用** —— 填 `200` + `Enter` 后 `scale` 1→2，菜单**不关闭**，输入框与左下角标签同时变 `200%`，双向同步'
      - 'batchAQ1：三档预设逐个点过全部生效，`scale` 实测 `2.10611`(211%) →`0.5`→`1`→`8`，三档 `hit: true`。**`211%` 这类数字来自「适合屏幕」，不是预设档位**'
    manual_pages:
      - 10-tasks/organize-canvas.md
    findings:
      - '整理画布**不是即时的**，会弹「是否保留此次整理结果？」，必须选「保留」才落盘。这条不写出来，用户会以为整理没生效。'
      - '**删除单个节点没有后悔药**：无二次确认、`⌘Z`/`⌘⇧Z` 都撤不回。删整张画布是有确认弹层的，两者的手感完全不同，不能互相类推。已写进 90-troubleshooting.md。'
      - '**复制后「画布上什么都没多」是正常现象**，不是复制失败。判据要用抽屉底部的「共 N 节点」，不能用页面里的渲染节点数 —— 后者只统计视口内的节点。'
      - '**底部「共 N 节点」数的是整张画布，不跟着筛选走**：类型筛选把列表收到 1 行时它照样写「共 3 节点」。同一个抽屉里有三个独立的收敛口（搜索框 / 类型筛选 / 星级筛选），可叠加。'
    not_verified: >-
      重命名时清空输入框再回车会怎样；附件 chip 上的删除按钮（hover 才出现）没点过；
      `添加到Agent` 挂两个同名 chip 的成因（DOM 上无法区分两者语义）；
      `展示设置` 的「展开/收起全部分组」在**有组**的画布上是什么效果 —— 这几轮建组都没成功，
      在没有组的画布上点它们列表纹丝不动，不能据此说它们无效；
      节点星级在哪里打；「资产」标签的「管理」为什么点了没反应（没有资产可管）。

  - id: storyboard-mode
    title: 在工作流与故事板两种视图间切换
    role: libtv-creator
    frequency: common
    impact: medium
    coverage: full
    status: verified
    evidence:
      - 'A4a-mode-workflow.png / A4b-mode-storyboard.png：顶栏「工作流」「故事板」'
      - '故事板态画布换成三列：文本 / 图片 / 视频，各带空态文案'
      - 'batchS/T/U（有内容）：文本列只有一行「文本节点 1」；图片列 = 「图片节点 2」+ 占位框「待确认后生成」+ `Lib Image 2.5 Pro` 标签；视频列 = 「视频节点 3」+ 行尾「对话」按钮 + 占位框 + `2.0` 标签 + 列头「全部」筛选。三列 x = 9 / 496 / 970，宽 461~473。切回工作流后节点数 3 → 3'
      - 'batchS/T/U：**点「故事板」会连带把 TV Director 面板拉出来跟着你**（浮层 class `mantine-Drawer-inner`，框 [1024,154,400×640]），右上角「—」可收起；底部状态条「故事板 正在跟随 / 按 ESC 退出」，且**切回工作流后它依然在**（跟的是整个画布）'
      - 'batchAJ/AK：切到故事板时 TV Director 面板自动弹出，**正好压住视频列右半边**，`[1024,154,400×640]`，挡在列头筛选（`[1328,57]`）下方'
      - 'batchAK1：视频列列头的「全部」筛选点开 = **成片 / 片段** 三项（`全部`✓ / `成片` / `片段`，菜单 120×130）。选「成片」后列头文案变为「成片」，**没生成过视频的节点行整行消失**（不是节点被删，是被筛掉了）'
      - 'batchAK2：**「对话」按钮在图片列和视频列都有，全页 2 枚**（`[888,107]` / `[1363,107]`，各 `52×20`），**平时 `opacity: 0`，悬停到节点行才显形**。点开 → 右侧 TV Director 抽屉 + **一个**附件 chip（编辑器 `innerText` = 「图片节点 2」），仍停欢迎页、`Send` 已 `disabled=false`。**与资产管理的「添加到Agent」机制相同但挂 1 个而非 2 个**'
    manual_pages:
      - 10-tasks/storyboard-mode.md
    findings:
      - '「对话」不是视频列专属，图片列节点行尾也有一枚，**且平时隐形**（要悬停）。正文此前把它写成「视频列专属的可见按钮」，两处都错了。'
      - '故事板的「全部」筛的是**成片 / 片段**，不是节点状态、也不是生成进度。'
    not_verified: >-
      成片 / 片段各自筛出什么（没生成过任何视频，选「成片」后整行消失，无法区分「筛掉了」和「本来就没有」）；
      切到故事板时 TV Director 面板顶栏那个「—」的实际收起行为（本轮脚本没找到这枚按钮）。
  - id: share-canvas
    title: 发布与分享
    role: libtv-creator
    frequency: occasional
    impact: high
    coverage: full
    status: documented
    evidence:
      - 'batchAR：面板逐控件清点 —— 触发点是顶栏 `aria-label="发布与分享"` 的 32×32 图标按钮 (1103,24)；面板 = `mantine-Popover-dropdown` `[759,48,360×167]`，**挂在顶栏下方的小浮层、不是居中弹窗**，画布照常可见可点'
      - 'batchAR：**面板里只有 2 枚按钮** —— `在LibTV上发布`（🌐，`[768,85,342×57]`）与 `分享链接`（🔗，`[768,150,342×57]`），`opacity: 1`、**都不是灰的**。枚举结果：**输入框 0 / 链接 0 / role=tab 0 / checkbox·switch 0** —— 这一层只负责跳转，发布表单和真正的链接都不在这里'
      - 'batchAR/AR2：两枚按钮的 hover 提示都写着「**按 ESC 退出**」，但 **Esc 实测无效**（按完面板纹丝不动）。证据链：点图标打开 → 面板在 → 按 Esc → **仍在** → 再点一次图标 → 关掉（`closedByReclick: true`，若 Esc 已关掉，再点会重新打开、此项应为 false）。Esc 前后 URL 与节点数均未变（`34226ef1…` / `10 → 10`），**按错无损失**'
    manual_pages:
      - 10-tasks/share-canvas.md
    not_verified: >-
      按安全边界**没有点「在LibTV上发布」、没有点「分享链接」、没有对外分享**。
      面板内有什么已逐控件坐实；但点下去之后会跳到哪、发布后的对外表现
      （他人打开看到什么、能否复制、能否撤回）本轮一律未验证。正文已逐条标 📖 写明这条边界。

  # ───────────── 节点 ─────────────
  - id: create-nodes
    title: 创建九类节点
    role: libtv-creator
    frequency: core
    impact: high
    coverage: flagship
    status: verified
    evidence:
      - 'B1-add-node-panel.png + B1-item-*.png：添加节点面板九项逐项高亮'
      - 'D-01..D-07-节点特写.png：每类节点卡片特写'
      - 'F-01..F-03-展开.png：文本/图片/视频选中后展开的完整编辑器'
    manual_pages:
      - 10-tasks/create-nodes.md
    node_types:
      - '文本 —— 尝试：自己编写内容 / 文生视频 / 图片反推提示词 / 文字生音乐'
      - '图片 —— 尝试：图生图 / 图片高清'
      - '视频 —— 尝试：5分钟超长视频 / 首尾帧生成视频 / 首帧生成视频'
