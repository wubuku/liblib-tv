    coverage: concise
    status: excluded
    evidence:
      - 'batchF/F1：点「打开导演台」进入全屏工作区，URL 不变；顶部「导演台 N」、中央 3D 视窗占位、底部输入框「描述想要搭建的场景，支持通过参考图创建」+ `+` / `↑`'
      - 'batchF/F1：页面弹出「请开启浏览器硬件加速」——当前浏览器无法使用硬件加速，导演台/全景预览/打光等 3D 功能暂不可用'
      - 'batchF/F1c：Esc 未退出工作区；界面文案含「正在跟随 / 取消 / 按 ESC 退出」'
    manual_pages:
      - 10-tasks/create-nodes.md
      - 90-troubleshooting.md
    exclusion_reason: >-
      **工作区的壳与硬件加速门槛已坐实并成稿**，但 3D 视窗**内部**（搭景、机位、
      参考图、关键帧、多视角截图）本轮无法进入：取证环境是无头 Chromium，
      没有 GPU 硬件加速，站点直接以「请开启浏览器硬件加速」挡下并拒绝加载 3D 视窗。
      这是**环境限制而非「测不了」**——要补齐需要一台开了硬件加速的机器，
      或在浏览器里开软件渲染后复测。宁可如实写明边界，也不编造 3D 视窗里的操作步骤。
