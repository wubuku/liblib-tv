manual_version: 1
target:
  app: frameos
  url: 'https://www.frameos.cn/#/canvas/01M34E48BEEVEQXR93Y8N70Y5N/01M34E4AKBTXT72KFD3MCYZ6NV'
  audience:
    - logged-in-canvas-creator
  depth: thorough
scope_authorization:
  user_confirmed: true
  note: 用户明确要求先探索画布并编写 FrameOS 画布功能手册，再考虑复刻。
tasks:
  - id: create-first-node
    title: 从空画布创建第一种节点
    role: logged-in-canvas-creator
    frequency: core
    impact: high
    coverage: flagship
    evidence:
      - type: source-ui
        note: 空态 CTA 提供 文本、图片、视频、音频、3D导演台、上传文件。
      - type: source-interaction
        note: 2026-09-23 已回走：添加节点菜单（含添加资源组）点击 图片 创建 图片节点2，自动选中并展开 Prompt 面板，撤销可用；双击空白打开“选择节点类型”菜单。截图 06/07。
    preconditions:
      - 已登录并打开一个画布
    routes:
      - '#/canvas/:workspaceId/:canvasId'
    status: verified
    manual_pages:
      - 10-tasks/create-first-node.md
  - id: navigate-canvas
    title: 拖动画布并控制缩放
    role: logged-in-canvas-creator
    frequency: core
    impact: high
    coverage: flagship
    evidence:
      - type: source-ui
        note: 左下工具条提供 画布小地图、缩小、100%、放大、适应画布、搜索节点、一键整理、选择整理方式。
      - type: source-interaction
        note: 2026-09-23 已回走：缩小/放大约 13% 步进、适应画布 273%→100%、⌘0 重置、小地图开关实测；左键拖动空白不平移（与帮助声明不一致）；滚轮/触摸板/空格拖动环境限制未验证。截图 03/13。
    preconditions:
      - 已登录并打开一个画布
    routes:
      - '#/canvas/:workspaceId/:canvasId'
    status: verified
    manual_pages:
      - 10-tasks/navigate-canvas.md
  - id: edit-selected-node
    title: 选中节点并编辑其内容与参数
    role: logged-in-canvas-creator
    frequency: core
    impact: high
    coverage: flagship
    evidence:
      - type: source-ui
        note: 文本节点选中态仅有 全屏查看/下载 工具条；图片节点面板含 聚焦/故事版/参考、删除连线、替换参考、Seedream 5.0 Pro、2K·16:9、高级设置与积分显示。
      - type: source-ui
        note: 2026-09-26 更新（Batch 225/238/239）：面板仅空媒体节点出现；有内容图片=十项工具行（无面板）、内容视频=九项工具行、空视频=无工具条但有视频专属面板（全能参考/首尾帧/视频编辑 + Wan 3.0 + 300）。
      - type: source-interaction
        note: 2026-09-23 已回走：双击进入 textarea、点击空白提交（节点文本更新 + 撤销可用）、Escape 不提交不取消；聚焦按钮进入“聚焦模式”（局部框选，非视口缩放）。截图 04/08/09/19。
    preconditions:
      - 画布中已有可编辑节点
    routes:
      - '#/canvas/:workspaceId/:canvasId'
    status: verified
    manual_pages:
      - 10-tasks/edit-selected-node.md
  - id: connect-nodes
    title: 连接两个节点并检查连线状态
    role: logged-in-canvas-creator
    frequency: core
    impact: high
    coverage: full
    evidence:
      - type: source-interaction
        note: 2026-09-23 已回走：删除连线按钮 1→0、Handle 拖拽重建 0→1（新边实例，text_out→prompt_in）、空白处释放取消连接；撤销可恢复被删节点并连带恢复连线。截图 05/10。
    preconditions:
      - 画布中已有两个可连接节点
    routes:
      - '#/canvas/:workspaceId/:canvasId'
    status: verified
    manual_pages:
      - 10-tasks/connect-nodes.md
  - id: duplicate-delete-history
    title: 复制、删除并恢复画布节点
    role: logged-in-canvas-creator
    frequency: common
    impact: high
    coverage: full
    evidence:
      - type: source-ui
        note: 右键菜单逐字：复制 ⌘C、复制图片（禁用）、创建副本 ⌘D、重新生成（禁用）、删除 ⌫（红色）。
      - type: source-interaction
        note: 2026-09-23 已回走：创建副本命名（副本）偏移(+30,+30)不复制连线；⌘D/⌫/⌘Z/⌘⇧Z 实测生效，撤销恢复删除节点并连带恢复边；⌘V 粘贴环境限制未验证；内容跨刷新持久、撤销历史不跨会话。截图 11。
    preconditions:
      - 画布中已有至少一个节点
    routes:
      - '#/canvas/:workspaceId/:canvasId'
    status: verified
    manual_pages:
      - 10-tasks/duplicate-delete-history.md
  - id: organize-and-search
    title: 搜索节点并整理画布布局
    role: logged-in-canvas-creator
    frequency: common
    impact: medium
    coverage: full
    evidence:
      - type: source-ui
        note: 左下存在 搜索节点、一键整理、选择整理方式；整理菜单三种方式逐字，当前方式带勾标。
      - type: source-interaction
        note: 2026-09-23 已回走：搜索“图片”列出全部图片节点、无匹配显示“无匹配节点”、点击结果选中并缩放聚焦（100%→273%）；网格整理微调布局并适配视口（100%→112%）、撤销可用。截图 12/13/14。
    preconditions:
      - 画布中已有多个节点
    routes:
      - '#/canvas/:workspaceId/:canvasId'
    status: verified
    manual_pages:
      - 10-tasks/organize-and-search.md
  - id: canvas-context
    title: 切换画布上下文并添加内容
    role: logged-in-canvas-creator
    frequency: common
    impact: medium
    coverage: full
    evidence:
      - type: source-ui
        note: 面包屑三级下拉（画布列表含新建/重命名/删除与节点计数）；项目资产面板（角色/物品/环境）；选择素材对话框（类型筛选、批量操作、本地上传，文件 input accept 含 image/video/audio/txt/docx/pdf）。
      - type: source-interaction
        note: 2026-09-23 已观察：三级下拉打开与 Escape 关闭、资产面板与素材库对话框打开关闭；下拉/树中的切换、重命名、删除、实际上传均未执行。用户真实项目名已去敏。截图 02/15/16/17。
    preconditions:
      - 已登录并打开一个画布
    routes:
      - '#/canvas/:workspaceId/:canvasId'
    status: verified
    manual_pages:
      - 10-tasks/canvas-context.md
  - id: help-and-shortcuts
    title: 打开帮助并使用画布快捷键
    role: logged-in-canvas-creator
    frequency: occasional
    impact: medium
    coverage: concise
    evidence:
      - type: source-ui
        note: 帮助面板“快捷键”全量逐字：创作/缩放/移动画布/其他四组（含 ⌘X、⌘F、M、?、⌘+/⌘−、⌘S、⌥拖动复制）。
      - type: source-interaction
        note: 2026-09-23 实测生效：⌘D、⌫、⌘Z、⌘⇧Z、⌘F、⌘0、Esc 取消选中；双击空白添加节点菜单。未验证（环境限制）：⌘V、M、?、双击节点聚焦、滚轮与触摸板手势。截图 18/19。
    preconditions:
      - 已登录并打开一个画布
    routes:
      - '#/canvas/:workspaceId/:canvasId'
    status: verified
    manual_pages:
      - 10-tasks/help-and-shortcuts.md
