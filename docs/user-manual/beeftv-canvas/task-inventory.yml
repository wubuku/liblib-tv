  - id: create-workspace
    title: 新建创作（`/create`）——三种创作模式的控件差异、快捷入口、灵感墙与未配模型时的提示
    area: 创作入口
    evidence: runtime+static
    finding: >
      `/create` 是产品第二大门户（index.tsx 1052 行 + creation-workspace.tsx 971 行 = 2023 行），
      本批之前**手册零专门覆盖**（仅 20-reference 路由表一行「新建创作」）。三处实测发现：
      ①**三种模式控件整体换掉**——视频（画幅 6 项 + 清晰度 5 档 + 时长）、图片（分辨率 4 项 +
      宽高比 10 项 + 质量 4 档 + 数量）、文本（**无参数面板**，改为「流式」「思考」两开关）；
      ②**未配模型时的提示在本地部署下误导**——「当前没有可用模型，请联系管理员或检查模型配置」，
      而本地工作区里模型由用户自己配，没有管理员可找（正确去处是左侧「模型配置」）；
      ③**「生成数量」上限跟着所选模型走**（`imageProfile.maxOutputs`），不是固定的 4 张，
      一次出不了多张的模型这一整栏不渲染。
      另核实两处**差点写成缺陷的假象**：「生成第一个镜头」是四张快捷入口卡里的第一张（不是通用
      生成按钮，切模式后文案不变属正常）；卡片的高亮只是 hover 样式，**没有按模式区分**。
      付费红线：全部实测停在发送之前，未触发任何真实生成。
    status: verified
    review_note: >
