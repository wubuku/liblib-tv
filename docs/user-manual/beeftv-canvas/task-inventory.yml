# BeefTV 画布用户手册 · 任务实施账本

manual_version: 1
target:
  app: beeftv
  url: 'http://localhost:3000（本地 web dev，vite；生产为自托管站点）'
  app_repo: '/Users/yangjiefeng/Documents/glanderness/BeefTV'
  app_version: 'v1.5.9（公共最新发布；调研锚点 v1.5.7/85c9686，差异见调研包 §35：浅色模式与素材限制对齐）'
  audience:
    - beeftv-creator
    - beeftv-agent-user
    - beef-admin
  depth: thorough
scope_authorization:
  user_confirmed: true
  note: 用户以 /goal 指令要求编写 BeefTV 用户手册并明确「不要停下来询问」——视为对「Agent 依证据自行定级」的常设授权；候选表在本文件与 PROGRESS.md 持续可见，用户可随时要求重排。
safety:
  paid_actions_forbidden: true
  note: 生成类动作（图片/视频/音频生成、AI 审美批改等）经云端渠道按量计费——手册正文可描述流程（来源为源码证据），验证只到付费边界前一步；全程不配置 Provider API Key、不触发真实生成。
evidence_base:
  - docs/research/beeftv-canvas-2026-09-27/SOURCE_ANALYSIS.md（35 章，702 处断言抽查 100% 吻合）
  - docs/research/beeftv-canvas-2026-09-27/INTERACTION_CATALOG.md（交互目录 10 节）
  - docs/research/beeftv-canvas-2026-09-27/PATTERN_CARDS.md（45 张模式卡）
  - docs/research/beeftv-canvas-2026-09-27/ITERATION_LOG.md（128 轮迭代史）
  - BeefTV 仓源码（锁定 85c9686，工作树 v1.5.9）
