    frequency: core
    impact: high
    coverage: flagship
    evidence:
      - type: static
        note: project.tsx 画布入口、空白右键/双击/底部工具栏五处创建入口（INTERACTION_CATALOG §5）；待运行时核实。
    preconditions:
      - 已启动 BeefTV web 并登录
    routes:
      - '/'
      - '/canvas'
    status: planned
    manual_pages:
      - 00-quickstart.md
